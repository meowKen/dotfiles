# Truecolor: advertise 24-bit RGB support to apps inside tmux (nvim themes)
set -g default-terminal "tmux-256color"
set -as terminal-features ",*:RGB"

# Replace C-b prefix key with easier C-a
unbind C-b
set-option -g prefix C-a
bind-key C-a send-prefix

# don't rename windows automatically
set-option -g allow-rename off

# start with window 1 (instead of 0)
set -g base-index 1

# start with pane 1
set -g pane-base-index 1

# Split pane with easyer shortcut
bind = split-window -h
bind - split-window -v
unbind '"'
unbind %

# Remove close-pane confirmation
bind x kill-pane

# Add shortcut "r" to reload tmux.conf
bind r source-file ~/.tmux.conf

# switch panes using Alt-arrow without prefix, or prefix+arrows.
# On arrival, leave copy mode if the destination pane was left in it.
bind -n M-Left  select-pane -L \; if -F "#{pane_in_mode}" { send-keys -X cancel }
bind -n M-Right select-pane -R \; if -F "#{pane_in_mode}" { send-keys -X cancel }
bind -n M-Up    select-pane -U \; if -F "#{pane_in_mode}" { send-keys -X cancel }
bind -n M-Down  select-pane -D \; if -F "#{pane_in_mode}" { send-keys -X cancel }
bind Left  select-pane -L \; if -F "#{pane_in_mode}" { send-keys -X cancel }
bind Right select-pane -R \; if -F "#{pane_in_mode}" { send-keys -X cancel }
bind Up    select-pane -U \; if -F "#{pane_in_mode}" { send-keys -X cancel }
bind Down  select-pane -D \; if -F "#{pane_in_mode}" { send-keys -X cancel }

# Enable mouse control
set -g mouse on

# Clicking an inactive pane only focuses it — no copy mode, no click passed
# through to the app — and cancels copy mode there, like prefix+arrows does.
# Clicks and drags inside the already-active pane keep the default behavior.
bind -n MouseDown1Pane if -Ft= "#{pane_active}" \
	{ select-pane -t = ; send-keys -M } \
	{ select-pane -t = ; if -Ft= "#{pane_in_mode}" { send-keys -t = -X cancel } }
bind -n MouseDrag1Pane if -Ft= "#{pane_active}" \
	{ if -Ft= "#{||:#{pane_in_mode},#{mouse_any_flag}}" { send-keys -M } { copy-mode -M } } \
	{ select-pane -t = }
# Same for panes already sitting in copy mode (they use their own key table)
bind -T copy-mode    MouseDown1Pane if -Ft= "#{pane_active}" \
	{ select-pane } { select-pane -t = ; send-keys -t = -X cancel }
bind -T copy-mode-vi MouseDown1Pane if -Ft= "#{pane_active}" \
	{ select-pane } { select-pane -t = ; send-keys -t = -X cancel }

# Mouse selection: copy without leaving copy mode, so the view doesn't jump
# back to the bottom and the highlight stays visible. Press q or Escape to exit.
bind -T copy-mode    MouseDragEnd1Pane send-keys -X copy-selection-no-clear
bind -T copy-mode-vi MouseDragEnd1Pane send-keys -X copy-selection-no-clear

# Same for double-click (word) and triple-click (line)
bind -n DoubleClick1Pane select-pane -t = \; if -F "#{||:#{pane_in_mode},#{mouse_any_flag}}" \
  { send-keys -M } { copy-mode -H ; send-keys -X select-word ; send-keys -X copy-selection-no-clear }
bind -n TripleClick1Pane select-pane -t = \; if -F "#{||:#{pane_in_mode},#{mouse_any_flag}}" \
  { send-keys -M } { copy-mode -H ; send-keys -X select-line ; send-keys -X copy-selection-no-clear }

# DESIGN TWEAKS

# don't do anything when a 'bell' rings
set -g visual-activity off
set -g visual-bell off
set -g visual-silence off
setw -g monitor-activity off
set -g bell-action none

# clock mode
setw -g clock-mode-colour yellow

# copy mode
setw -g mode-style 'fg=colour234 bg=colour153' # 'fg=colour234 bg=colour171 bold'

# panes
set -g pane-border-style 'fg=colour153'
set -g pane-active-border-style 'fg=colour177'

# statusbar
set -g status-position bottom
set -g status-justify left
set -g status-style 'fg=red'

set -g status-left '#S '
set -g status-left-style 'fg=colour153'
set -g status-left-length 150 

set -g status-right-style 'fg=colour153'
set -g status-right '%Y-%m-%d %H:%M '
set -g status-right-length 50

setw -g window-status-current-style 'fg=black bg=colour153'
setw -g window-status-current-format ' #I #W #F '

setw -g window-status-style 'fg=colour153'
setw -g window-status-separator ' '
setw -g window-status-format ' #I #[fg=colour250]#W #[fg=colour153]#F '

setw -g window-status-bell-style 'fg=yellow bg=red bold'

# messages
set -g message-style 'fg=yellow bg=red bold'

# PLUGINS

# Plugin manager
set -g @plugin 'tmux-plugins/tpm'

# Plugins, do [C-a r] to reload the config file then [C-a I] to install the plugin 
set -g @plugin 'tmux-plugins/tmux-resurrect'
set -g @plugin 'tmux-plugins/tmux-continuum'

set -g @resurrect-capture-pane-contents 'on'
set -g @continuum-restore 'on'

# Keep this at the very last line
run '~/.tmux/plugins/tpm/tpm'
